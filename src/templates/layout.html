<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/styles.css?v=20260116-4" />
  </head>
  <body>
    <header class="site-header">
      <button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="mobile-nav">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a class="logo-block" href="/">
        <div class="logo-mark">
          <img src="/logo-fuchilabo.png" alt="ふちLABO. ロゴ" />
        </div>
      </a>
      <nav class="nav-links">
        <a href="/">HOME</a>
        <a href="/about">ABOUT</a>
        <a href="/contact">CONTACT</a>
      </nav>
    </header>

    <main class="page">
      <section class="page-heading">
        <a class="back-link" href="{{backLink}}">← 戻る</a>
        <h1>{{title}}</h1>
        <p class="subtitle">{{subtitle}}</p>
      </section>
      <section>
        {{content}}
      </section>
    </main>

    <nav id="mobile-nav" class="mobile-nav" aria-label="モバイルメニュー">
      <div class="mobile-nav-inner">
        <button class="mobile-nav-close" aria-label="メニューを閉じる">×</button>
        <a href="/">HOME</a>
        <a href="/about">ABOUT</a>
        <a href="/contact">CONTACT</a>
      </div>
    </nav>

    <footer class="site-footer">
      <div class="footer-social">
        <a
          href="https://www.instagram.com/fuchio_4suimei/"
          class="footer-icon"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram｜てつ先生 四柱推命講師"
          data-tooltip="Instagram｜てつ先生｜四柱推命講師"
        >
          <img src="/icons/ig-tetsu.jpg" alt="Instagram｜てつ先生" />
        </a>
        <a
          href="https://www.instagram.com/chii__natural.4suimei/"
          class="footer-icon"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram｜千草 四柱推命×AIアート"
          data-tooltip="Instagram｜千草｜四柱推命×AIアート"
        >
          <img src="/icons/ig-chigusa.jpg" alt="Instagram｜千草" />
        </a>
        <a
          href="https://podcasts.apple.com/jp/podcast/id1696590889"
          class="footer-icon"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Podcast｜四柱推命な日常がきこえる"
          data-tooltip="Podcast｜四柱推命な日常がきこえる"
        >
          <img src="/icons/podcast.jpg" alt="Podcast｜四柱推命な日常がきこえる" />
        </a>
        <a
          href="https://www.youtube.com/@fuchio.502/streams"
          class="footer-icon"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="YouTube｜実践鑑定ライブ"
          data-tooltip="YouTube｜実践鑑定ライブ"
        >
          <img src="/icons/youtube.jpg" alt="YouTube｜実践鑑定ライブ" />
        </a>
      </div>
      <div class="footer-links">
        <a href="/legal">特定商取引法に関する表記</a>
        <span class="footer-separator">｜</span>
        <a href="/terms">利用規約</a>
        <span class="footer-separator">｜</span>
        <a href="/privacy">プライバシーポリシー</a>
      </div>
      <p>© ふちLABO. /自然の景色でみる四柱推命を探究するラボ</p>
    </footer>

    <script>
      (function () {
        var isTouch = 'ontouchstart' in window || (navigator && navigator.maxTouchPoints > 0);
        if (!isTouch) return;

        var icons = document.querySelectorAll('.footer-icon[data-tooltip]');
        for (var i = 0; i < icons.length; i++) {
          (function (icon) {
            icon.addEventListener('click', function (e) {
              var el = e.currentTarget;
              var href = el.getAttribute('href');
              if (!href) return;

              if (!el.classList.contains('tooltip-active')) {
                // 1回目タップ: ツールチップだけ表示して遷移はしない
                e.preventDefault();
                el.classList.add('tooltip-active');
                setTimeout(function () {
                  el.classList.remove('tooltip-active');
                }, 3000);
              } else {
                // 2回目タップ: ツールチップを消してリンク先へ遷移
                el.classList.remove('tooltip-active');
                window.location.href = href;
              }
            });
          })(icons[i]);
        }
      })();
    </script>

    <script>
      (function () {
        var toggle = document.querySelector('.menu-toggle');
        var mobileNav = document.getElementById('mobile-nav');
        var closeBtn = document.querySelector('.mobile-nav-close');

        if (!toggle || !mobileNav) return;

        function openNav() {
          mobileNav.classList.add('open');
          toggle.setAttribute('aria-expanded', 'true');
        }

        function closeNav() {
          mobileNav.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }

        toggle.addEventListener('click', function () {
          if (mobileNav.classList.contains('open')) {
            closeNav();
          } else {
            openNav();
          }
        });

        if (closeBtn) {
          closeBtn.addEventListener('click', closeNav);
        }

        mobileNav.addEventListener('click', function (e) {
          if (e.target === mobileNav) {
            closeNav();
          }
        });
      })();
    </script>
  </body>
</html>
